<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StokTakip Pro — Yönetici Paneli</title>
  <meta name="description" content="Elektronik mağaza stok ve satış yönetim sistemi" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "var(--color-primary)",
            "primary-hover": "var(--color-primary-hover)",
            "background-dark": "var(--color-bg-dark)",
            "surface-dark": "var(--color-surface-dark)",
            "surface-hover": "var(--color-surface-hover)",
            slate: {
              50: "#0f172a",
              100: "#1e293b",
              200: "#1e293b",
              300: "#334155",
              400: "#475569",
              500: "#64748b",
              600: "#94a3b8",
              700: "#f1f5f9",
              800: "#ffffff",
              850: "#ffffff",
              900: "#f8fafc",
              950: "#f1f5f9",
            },
            zinc: {
              900: "#f8fafc",
            },
            gray: {
              400: "#475569",
              500: "#64748b",
            },
            "chart-label": "var(--chart-label)",
            "chart-ring-background": "var(--chart-ring-background)",
            "chart-marker-foreground": "var(--chart-marker-foreground)",
            "chart-marker-border": "var(--chart-marker-border)",
            "chart-marker-background": "var(--chart-marker-background)",
            "chart-tooltip-muted": "var(--chart-tooltip-muted)",
            "chart-tooltip-foreground": "var(--chart-tooltip-foreground)",
            "chart-tooltip-background": "var(--chart-tooltip-background)",
            "chart-grid": "var(--chart-grid)",
            "chart-crosshair": "var(--chart-crosshair)",
            "chart-line-secondary": "var(--chart-line-secondary)",
            "chart-line-primary": "var(--chart-line-primary)",
            "chart-foreground-muted": "var(--chart-foreground-muted)",
            "chart-foreground": "var(--chart-foreground)",
            "chart-background": "var(--chart-background)",
          },
          fontFamily: { sans: ["Inter", "sans-serif"] },
        },
      },
    };
  </script>
  <style>
    /* === TEMA CSS DEĞİŞKENLERİ === */
    :root {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-bg-dark: #f6f7f9;
      --color-surface-dark: #ffffff;
      --color-surface-hover: #f1f5f9;
      --color-text-primary: #000000;
      --color-text-secondary: #1f2937;
      --color-border: #e5e7eb;

      --chart-background: oklch(1 0 0);
      --chart-foreground: oklch(0.145 0.004 285);
      --chart-foreground-muted: oklch(0.55 0.014 260);
      --chart-line-primary: oklch(0.623 0.214 255);
      --chart-line-secondary: oklch(0.705 0.015 265);
      --chart-crosshair: oklch(0.4 0.1828 274.34);
      --chart-grid: oklch(0.9 0 0);
      --chart-tooltip-background: oklch(0.985 0 0 / 0.95);
      --chart-tooltip-foreground: oklch(0.145 0.004 285);
      --chart-tooltip-muted: oklch(0.55 0.014 260);
      --chart-marker-background: oklch(0.97 0.005 260);
      --chart-marker-border: oklch(0.85 0.01 260);
      --chart-marker-foreground: oklch(0.3 0.01 260);
      --chart-ring-background: oklch(0.9 0.005 260 / 0.25);
      --chart-label: oklch(0.45 0.01 260);
    }

    .dark {
      --color-primary: #2563eb;
      --color-primary-hover: #1d4ed8;
      --color-bg-dark: #f6f7f9;
      --color-surface-dark: #ffffff;
      --color-surface-hover: #f1f5f9;
      --color-text-primary: #000000;
      --color-text-secondary: #1f2937;
      --color-border: #e5e7eb;

      --chart-background: oklch(1 0 0);
      --chart-foreground: oklch(0.145 0.004 285);
      --chart-foreground-muted: oklch(0.55 0.014 260);
      --chart-line-primary: oklch(0.623 0.214 255);
      --chart-line-secondary: oklch(0.705 0.015 265);
      --chart-crosshair: oklch(0.4 0.1828 274.34);
      --chart-grid: oklch(0.9 0 0);
      --chart-tooltip-background: oklch(0.985 0 0 / 0.95);
      --chart-tooltip-foreground: oklch(0.145 0.004 285);
      --chart-tooltip-muted: oklch(0.55 0.014 260);
      --chart-marker-background: oklch(0.97 0.005 260);
      --chart-marker-border: oklch(0.85 0.01 260);
      --chart-marker-foreground: oklch(0.3 0.01 260);
      --chart-ring-background: oklch(0.9 0.005 260 / 0.25);
      --chart-label: oklch(0.45 0.01 260);
    }

    /* Tailwind custom renklerini CSS değişkenleriyle override et */
    .bg-primary {
      background-color: var(--color-primary) !important;
    }

    .text-primary {
      color: var(--color-primary) !important;
    }

    .border-primary {
      border-color: var(--color-primary) !important;
    }

    .ring-primary {
      --tw-ring-color: var(--color-primary) !important;
    }

    .bg-primary\/10 {
      background-color: color-mix(in srgb, var(--color-primary) 10%, transparent) !important;
    }

    .bg-primary\/20 {
      background-color: color-mix(in srgb, var(--color-primary) 20%, transparent) !important;
    }

    .text-primary\/70 {
      color: color-mix(in srgb, var(--color-primary) 70%, transparent) !important;
    }

    .hover\:bg-primary\/90:hover {
      background-color: color-mix(in srgb, var(--color-primary) 90%, transparent) !important;
    }

    .border-primary\/30 {
      border-color: color-mix(in srgb, var(--color-primary) 30%, transparent) !important;
    }

    .bg-background-dark {
      background-color: var(--color-bg-dark) !important;
    }

    .bg-surface-dark {
      background-color: var(--color-surface-dark) !important;
    }

    .bg-surface-hover {
      background-color: var(--color-surface-hover) !important;
    }

    .bg-surface-hover\/50 {
      background-color: color-mix(in srgb, var(--color-surface-hover) 50%, transparent) !important;
    }

    /* === GLOBAL BORDER AND DIVIDER OVERRIDES === */
    [class*="border-slate-"], [class*="divide-slate-"] {
      border-color: var(--color-border) !important;
    }

    /* === GLOBAL TEXT OVERRIDES === */
    .text-slate-50, .text-slate-100, .text-slate-200, .text-slate-300, .text-slate-700, .text-slate-800, .text-slate-850, .text-slate-900, .text-slate-950, .text-zinc-900, .text-zinc-950 {
      color: #000000 !important;
    }
    .text-slate-400, .text-slate-500, .text-slate-600 {
      color: #1f2937 !important;
    }

    /* === TEXT WHITE SMART OVERRIDE === */
    .text-white {
      color: #000000 !important;
    }
    .bg-primary .text-white,
    [class*="bg-primary"] .text-white,
    .bg-primary.text-white,
    [class*="bg-primary"].text-white,
    .bg-violet-500 .text-white,
    .bg-violet-600 .text-white,
    .bg-violet-500.text-white,
    .bg-violet-600.text-white,
    .bg-emerald-500 .text-white,
    .bg-emerald-600 .text-white,
    .bg-emerald-500.text-white,
    .bg-emerald-600.text-white,
    .bg-red-500 .text-white,
    .bg-red-600 .text-white,
    .bg-red-500.text-white,
    .bg-red-600.text-white,
    .bg-blue-500 .text-white,
    .bg-blue-600 .text-white,
    .bg-blue-500.text-white,
    .bg-blue-600.text-white,
    .bg-slate-600 .text-white,
    .bg-slate-600.text-white,
    .bg-purple-500 .text-white,
    .bg-purple-600 .text-white,
    .bg-purple-500.text-white,
    .bg-purple-600.text-white,
    .bg-indigo-500 .text-white,
    .bg-indigo-600 .text-white,
    .bg-indigo-500.text-white,
    .bg-indigo-600.text-white,
    button[class*="bg-primary"] .text-white,
    button[class*="bg-primary"].text-white,
    button[class*="bg-violet"] .text-white,
    button[class*="bg-violet"].text-white,
    button[class*="bg-emerald"] .text-white,
    button[class*="bg-emerald"].text-white,
    button[class*="bg-blue"] .text-white,
    button[class*="bg-blue"].text-white,
    button[class*="bg-red"] .text-white,
    button[class*="bg-red"].text-white,
    button[class*="bg-purple"] .text-white,
    button[class*="bg-purple"].text-white,
    button[class*="bg-indigo"] .text-white,
    button[class*="bg-indigo"].text-white,
    button[class*="bg-slate-600"] .text-white,
    button[class*="bg-slate-600"].text-white,
    span[class*="bg-emerald-500"] .text-white,
    span[class*="bg-green-500"] .text-white,
    span[class*="bg-blue-500"] .text-white,
    span[class*="bg-red-500"] .text-white,
    span[class*="bg-violet-500"] .text-white,
    span[class*="bg-purple-500"] .text-white,
    span[class*="bg-primary"] .text-white,
    div[class*="bg-primary"] .text-white {
      color: #ffffff !important;
    }

    .text-emerald-400, .text-emerald-500 {
      color: var(--color-primary) !important;
    }
    .bg-emerald-500\/10, .bg-emerald-500\/20 {
      background-color: color-mix(in srgb, var(--color-primary) 10%, transparent) !important;
    }
    .border-emerald-500\/20, .border-emerald-500\/30 {
      border-color: color-mix(in srgb, var(--color-primary) 20%, transparent) !important;
    }
    
    input, select, textarea, option {
      background-color: var(--color-surface-dark) !important;
      border-color: var(--color-border) !important;
      color: #000000 !important;
    }
    input::placeholder, textarea::placeholder {
      color: #555555 !important;
    }

    html,
    body {
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      max-width: 100vw;
    }

    #root,
    #root>div,
    #root>div>main {
      overflow-x: hidden;
      max-width: 100vw;
    }

    .glass-panel {
      background: var(--color-surface-dark) !important;
      border: 1px solid var(--color-border) !important;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.06) !important;
    }

    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: transparent;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 3px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }

    @keyframes slideIn {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    .animate-slide-in {
      animation: slideIn 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.95);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .animate-fade-in {
      animation: fadeIn 0.2s ease-out;
    }

    /* === SAYFA GEÇİŞ ANİMASYONU === */
    @keyframes pageEnter {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-page-enter {
      animation: pageEnter 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* === BUTON TIKLANMA EFEKTİ === */
    .btn-press {
      transition: transform 0.15s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.15s ease;
    }

    .btn-press:active {
      transform: scale(0.96);
    }

    /* === MENÜ ÖĞESİ ANİMASYONLARI === */
    .menu-item {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
      position: relative;
    }

    .menu-item:hover {
      transform: translateX(4px);
    }

    .menu-item:active {
      transform: translateX(2px) scale(0.98);
    }

    /* Aktif menü göstergesi */
    .menu-indicator {
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* === RENK GEÇİŞ YUMUŞATMA (Tema değişimi) === */
    *,
    *::before,
    *::after {
      transition: background-color 0.35s ease, border-color 0.35s ease, color 0.2s ease, box-shadow 0.3s ease;
    }

    /* Input/textarea'da yazarken transition olmasın */
    input:focus,
    textarea:focus,
    select:focus,
    input,
    textarea,
    select {
      transition: border-color 0.2s ease, box-shadow 0.2s ease !important;
    }

    /* Scrollbar ve animasyonlu elementleri hariç tut */
    .scrollbar-thin::-webkit-scrollbar-thumb,
    [class*="animate-spin"],
    [class*="animate-pulse"] {
      transition: none !important;
    }

    /* === KART HOVER EFEKTİ === */
    .card-hover {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
    }

    .card-hover:hover {
      transform: translateY(-1px) !important;
      box-shadow: 0 4px 12px 0 rgba(0, 0, 0, 0.05) !important;
    }

    /* === ICON ANİMASYONU === */
    .icon-bounce {
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .icon-bounce:hover {
      transform: scale(1.15);
    }

    .icon-bounce:active {
      transform: scale(0.9);
    }

    /* === TARİH GİRİŞİ (DATE INPUT) STİLLERİ === */
    input[type="date"] {
      color-scheme: light;
      cursor: pointer;
      position: relative;
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: none;
      cursor: pointer;
      opacity: 0.5;
      transition: opacity 0.2s ease;
      padding: 2px;
    }

    input[type="date"]::-webkit-calendar-picker-indicator:hover {
      opacity: 0.8;
    }
  </style>
</head>

<body class="bg-background-dark text-[var(--color-text-primary)] min-h-screen overflow-hidden">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
